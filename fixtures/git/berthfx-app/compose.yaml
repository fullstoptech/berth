name: berthfx-app
services:
  web:
    image: nginx:alpine
    labels: [dev.berth.fixture=1]
    ports:
      - "127.0.0.1:56091:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s
